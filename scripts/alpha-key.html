<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Alpha key pipeline</title>
<style>
  body { font-family: system-ui, sans-serif; padding: 24px; background: #0f172a; color: #e2e8f0; }
  .row { display: flex; align-items: center; gap: 12px; padding: 6px 0; font-size: 13px; }
  .ok { color: #4ade80; } .skip { color: #fbbf24; } .err { color: #f87171; }
  img { width: 64px; height: 64px; object-fit: contain; background: #334155; border-radius: 4px; }
</style>
</head>
<body>
<h1>Alpha key pipeline</h1>
<div id="log"></div>
<script>
const FILES = __FILES__;

/**
 * Elimina el fondo blanco SOLO en la región conectada al borde
 * (flood fill). Así el blanco interno del producto (cajas, etiquetas)
 * se conserva intacto.
 */
function keyOutWhite(ctx, w, h, threshold) {
  const img = ctx.getImageData(0, 0, w, h);
  const d = img.data;
  const nearWhite = (i) => {
    const a = d[i * 4 + 3];
    return a > 8 && d[i * 4] >= 255 - threshold && d[i * 4 + 1] >= 255 - threshold && d[i * 4 + 2] >= 255 - threshold;
  };
  const seen = new Uint8Array(w * h);
  const stack = [];
  const visit = (x, y) => {
    if (x < 0 || y < 0 || x >= w || y >= h) return;
    const i = y * w + x;
    if (seen[i]) return;
    seen[i] = 1;
    if (nearWhite(i)) stack.push(i);
  };
  for (let x = 0; x < w; x++) { visit(x, 0); visit(x, h - 1); }
  for (let y = 0; y < h; y++) { visit(0, y); visit(w - 1, y); }

  const region = [];
  while (stack.length) {
    const i = stack.pop();
    region.push(i);
    const x = i % w, y = (i / w) | 0;
    visit(x + 1, y); visit(x - 1, y); visit(x, y + 1); visit(x, y - 1);
  }

  // Feather: 1 px de borde con alpha parcial para evitar halo blanco.
  const feather = [];
  for (const i of region) {
    const x = i % w, y = (i / w) | 0;
    const nb = [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]];
    for (const [nx, ny] of nb) {
      if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
      const j = ny * w + nx;
      if (d[j * 4 + 3] > 0 && nearWhite(j)) feather.push(j);
    }
  }

  for (const i of region) d[i * 4 + 3] = 0;
  for (const j of feather) {
    const m = Math.min(d[j * 4], d[j * 4 + 1], d[j * 4 + 2]);
    const soft = Math.max(0, Math.min(255, ((m - (255 - threshold)) / threshold) * 255));
    d[j * 4 + 3] = Math.min(d[j * 4 + 3], Math.round(255 - soft));
  }
  ctx.putImageData(img, 0, 0);
  return region.length / (w * h);
}

/**
 * Despeckle: conserva sólo los componentes opacos significativos del
 * producto y descarta islas sueltas (franjas de captura, motas, etc.).
 * Luego recorta al bounding box del producto.
 */
function despeckleAndCrop(ctx, w, h) {
  const img = ctx.getImageData(0, 0, w, h);
  const d = img.data;
  const label = new Int32Array(w * h).fill(-1);
  const comps = [];

  for (let start = 0; start < w * h; start++) {
    if (d[start * 4 + 3] <= 8 || label[start] !== -1) continue;
    const id = comps.length;
    const stack = [start];
    label[start] = id;
    let area = 0;
    let minX = w, maxX = -1, minY = h, maxY = -1;
    while (stack.length) {
      const i = stack.pop();
      area++;
      const x = i % w, y = (i / w) | 0;
      if (x < minX) minX = x;
      if (x > maxX) maxX = x;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;
      const nb = [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]];
      for (const [nx, ny] of nb) {
        if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
        const j = ny * w + nx;
        if (label[j] !== -1 || d[j * 4 + 3] <= 8) continue;
        label[j] = id;
        stack.push(j);
      }
    }
    comps.push({ id, area, minX, maxX, minY, maxY });
  }

  if (comps.length === 0) return { w, h, ok: false };

  const largest = comps.reduce((a, b) => (b.area > a.area ? b : a));
  const keep = new Set(
    comps.filter((c) => c.area >= largest.area * 0.06).map((c) => c.id)
  );

  // Borra las islas descartadas.
  for (let i = 0; i < w * h; i++) {
    if (d[i * 4 + 3] > 8 && label[i] !== -1 && !keep.has(label[i])) {
      d[i * 4 + 3] = 0;
    }
  }

  // Bounding box de lo que queda.
  let minX = w, maxX = -1, minY = h, maxY = -1;
  for (const c of comps) {
    if (!keep.has(c.id)) continue;
    if (c.minX < minX) minX = c.minX;
    if (c.maxX > maxX) maxX = c.maxX;
    if (c.minY < minY) minY = c.minY;
    if (c.maxY > maxY) maxY = c.maxY;
  }
  if (maxX < 0) return { w, h, ok: false };

  const pad = 4;
  minX = Math.max(0, minX - pad);
  minY = Math.max(0, minY - pad);
  maxX = Math.min(w - 1, maxX + pad);
  maxY = Math.min(h - 1, maxY + pad);
  const cw = maxX - minX + 1;
  const ch = maxY - minY + 1;

  const out = ctx.createImageData(cw, ch);
  for (let y = 0; y < ch; y++) {
    for (let x = 0; x < cw; x++) {
      const src = ((y + minY) * w + (x + minX)) * 4;
      const dst = (y * cw + x) * 4;
      out.data[dst] = d[src];
      out.data[dst + 1] = d[src + 1];
      out.data[dst + 2] = d[src + 2];
      out.data[dst + 3] = d[src + 3];
    }
  }
  const c2 = document.createElement('canvas');
  c2.width = cw;
  c2.height = ch;
  c2.getContext('2d').putImageData(out, 0, 0);
  return { canvas: c2, w: cw, h: ch, ok: true };
}

function log(msg, cls) {
  const el = document.createElement('div');
  el.className = 'row ' + (cls || '');
  el.innerHTML = msg;
  document.getElementById('log').appendChild(el);
}

async function processOne(file) {
  const img = new Image();
  img.crossOrigin = 'anonymous';
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = '/medicamentos/' + file; });

  const c = document.createElement('canvas');
  c.width = img.naturalWidth;
  c.height = img.naturalHeight;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(img, 0, 0);

  let ratio = 0;
  try {
    ratio = keyOutWhite(ctx, c.width, c.height, 26);
  } catch (e) {
    log(`<span>${file}</span> <span class="err">error: ${e.message}</span>`, '');
    return { file, alpha: false };
  }

  if (ratio < 0.12) {
    // Fondo con foto real (no blanco plano): se deja la imagen original.
    log(`<span>${file}</span> <span class="skip">sin recorte (fondo fotográfico)</span>`, '');
    return { file, alpha: false };
  }

  let outCanvas = c;
  try {
    const clean = despeckleAndCrop(ctx, c.width, c.height);
    if (clean.ok && clean.canvas) outCanvas = clean.canvas;
  } catch (e) {
    log(`<span>${file}</span> <span class="skip">despeckle omitido: ${e.message}</span>`, '');
  }

  const blob = await new Promise((r) => outCanvas.toBlob(r, 'image/png'));
  const name = file.replace(/\.[^.]+$/, '') + '.png';
  const res = await fetch('/__save?name=' + encodeURIComponent(name), { method: 'POST', body: blob });
  if (!res.ok) throw new Error('save failed ' + res.status);
  log(`<span>${file}</span> <span class="ok">recortado ${(ratio * 100).toFixed(0)}% → ${name} (${outCanvas.width}×${outCanvas.height})</span>`, '');
  return { file, alpha: true };
}

(async () => {
  const results = [];
  for (const f of FILES) {
    try {
      results.push(await processOne(f));
    } catch (e) {
      log(`<span>${f}</span> <span class="err">error: ${e.message}</span>`, '');
      results.push({ file: f, alpha: false });
    }
  }
  const alpha = results.filter((r) => r.alpha).map((r) => r.file.replace(/\.[^.]+$/, ''));
  const manifest = Object.fromEntries(alpha.map((n) => [n, true]));
  await fetch('/__save?name=__manifest__.json', {
    method: 'POST',
    body: JSON.stringify(manifest, null, 2),
  });
  document.title = 'DONE:' + JSON.stringify(manifest);
  log(`<b>Listo.</b> ${alpha.length}/${results.length} con transparencia.`, 'ok');
})();
</script>
</body>
</html>
